<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QrexApi · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--bg2:#0d0d16;--bg3:#12121c;--bg4:#1a1a28;--border:#2a2a3d;--border2:#3a3a52;--text:#e8e8f0;--muted:#8b8b9e;--dim:#5a5a6e;--accent:#7c3aed;--accent2:#a78bfa;--accent3:#6d28d9;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--radius:14px;--radius-sm:10px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
button,input,select,textarea{font-family:inherit}.mono{font-family:'JetBrains Mono',ui-monospace,monospace}a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
#auth-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.15),transparent 60%)}
.auth-card{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.auth-card .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.35);padding:4px 12px;border-radius:999px;margin-bottom:16px}
.auth-card h1{font-size:24px;font-weight:800;margin-bottom:6px}.auth-card .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:10px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:8px;font-weight:600;cursor:pointer}.tabs button.active{background:var(--accent);color:#fff}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,textarea,select{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none}
.field input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
textarea{min-height:140px;font-family:'JetBrains Mono',monospace;font-size:12.5px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:0;border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;width:100%}.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--bg4);color:var(--text);border:1px solid var(--border)}.btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.btn-sm{padding:8px 12px;font-size:12px;width:auto}.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;display:none}
.discord-btn{margin-top:12px;width:100%;background:#5865F2;color:#fff;border:0;padding:12px;border-radius:var(--radius-sm);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--dim);font-size:12px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
#app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50}
.sidebar .logo{padding:20px 18px;font-weight:800;font-size:18px;border-bottom:1px solid var(--border)}.sidebar .logo span{background:linear-gradient(135deg,var(--accent2),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:var(--muted);font-weight:500;font-size:13.5px;cursor:pointer;margin-bottom:2px;border:0;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--bg4);color:var(--text)}.nav-item.active{background:rgba(124,58,237,.18);color:var(--accent2)}
.user-box{padding:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ec4899);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}.user-meta{flex:1;min-width:0}.user-meta .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-meta .role{font-size:11px;color:var(--muted)}
.main{margin-left:240px;min-height:100vh}
.topbar{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,7,12,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.topbar h2{font-size:16px;font-weight:700}.content{padding:24px;max-width:1200px}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu-btn{display:inline-flex!important}}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:18px}.stat .label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}.stat .value{font-size:26px;font-weight:800}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.card-h h3{font-size:14px;font-weight:700}.card-b{padding:18px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:0}tr:hover td{background:rgba(255,255,255,.02)}
.badge-sm{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-green{background:rgba(52,211,153,.15);color:var(--green)}.badge-purple{background:rgba(124,58,237,.15);color:var(--accent2)}
.badge-yellow{background:rgba(251,191,36,.15);color:var(--yellow)}.badge-red{background:rgba(248,113,113,.15);color:var(--red)}.badge-blue{background:rgba(96,165,250,.15);color:var(--blue)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.open{display:flex}
.modal{background:var(--bg3);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.5)}.modal.wide{max-width:720px}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:20px}.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.close-x{background:transparent;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg4);border:1px solid var(--border);padding:14px 18px;border-radius:12px;font-size:13px;font-weight:500;z-index:200;box-shadow:0 12px 40px rgba(0,0,0,.4);transform:translateY(120%);transition:.25s;max-width:360px}.toast.show{transform:translateY(0)}.toast.ok{border-color:rgba(52,211,153,.4)}.toast.err{border-color:rgba(248,113,113,.4)}
.actions{display:flex;gap:6px;flex-wrap:wrap}.copy-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all;color:var(--accent2)}
.flex{display:flex;gap:10px;align-items:center}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mb-4{margin-bottom:16px}.hidden{display:none!important}
.menu-btn{display:none;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);cursor:pointer}
</style>
</head>
<body>
<div id="auth-view">
  <div class="auth-card">
    <div class="badge">QYREXAPI</div>
    <h1>Bienvenido</h1>
    <p class="sub">Protege scripts · Key system · Hub público</p>
    <div class="tabs">
      <button class="active" data-tab="login" onclick="switchTab('login')">Iniciar sesión</button>
      <button data-tab="register" onclick="switchTab('register')">Registrarse</button>
    </div>
    <div id="auth-err" class="err"></div>
    <div id="login-form">
      <div class="field"><label>Usuario</label><input id="login-user" autocomplete="username" placeholder="tu_usuario"/></div>
      <div class="field"><label>Contraseña</label><input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••"/></div>
      <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
    </div>
    <div id="register-form" class="hidden">
      <div class="field"><label>Usuario</label><input id="reg-user" autocomplete="username" placeholder="min. 3 caracteres"/></div>
      <div class="field"><label>Contraseña</label><input id="reg-pass" type="password" autocomplete="new-password" placeholder="min. 4 caracteres"/></div>
      <button class="btn btn-primary" onclick="doRegister()">Crear cuenta</button>
    </div>
    <div class="divider">o</div>
    <button class="discord-btn" onclick="location.href='/auth/discord'">Continuar con Discord</button>
  </div>
</div>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span>◆ QrexApi</span></div>
    <nav class="nav">
      <button class="nav-item active" data-page="dashboard" onclick="go('dashboard')">Dashboard</button>
      <button class="nav-item" data-page="scripts" onclick="go('scripts')">Scripts</button>
      <button class="nav-item" data-page="keys" onclick="go('keys')">Keys</button>
      <button class="nav-item" data-page="providers" onclick="go('providers')">Providers</button>
      <button class="nav-item" data-page="hub" onclick="go('hub')">Hub</button>
      <button class="nav-item" data-page="logs" onclick="go('logs')">Logs</button>
      <button class="nav-item" data-page="webhooks" onclick="go('webhooks')">Webhooks</button>
      <button class="nav-item" data-page="account" onclick="go('account')">Cuenta</button>
      <button class="nav-item admin-only hidden" data-page="admin" onclick="go('admin')">Admin</button>
    </nav>
    <div class="user-box">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-meta"><div class="name" id="user-name">—</div><div class="role" id="user-role">—</div></div>
      <button class="btn btn-ghost btn-sm" onclick="logout()" title="Salir">⎋</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="flex"><button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><h2 id="page-title">Dashboard</h2></div>
      <div class="flex"><span id="premium-badge" class="badge-sm badge-purple hidden">PREMIUM</span><button class="btn btn-ghost btn-sm" onclick="refreshCurrent()">↻ Refresh</button></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"><div class="modal-h"><h3 id="modal-title">—</h3><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-b" id="modal-body"></div><div class="modal-f" id="modal-footer"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const API='';let token=localStorage.getItem('qrex_token')||'';let me=null;let currentPage='dashboard';let cache={scripts:[],providers:[],keys:[],logs:[],webhooks:[],hub:[]};
(function(){const p=new URLSearchParams(location.search);const t=p.get('token');if(t){localStorage.setItem('qrex_token',t);token=t;history.replaceState({},'',location.pathname);}const err=p.get('discord_error');if(err){showAuthErr(decodeURIComponent(err));history.replaceState({},'',location.pathname);}})();
function headers(){return{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};}
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers(),...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error(data.error||'No autorizado');}if(!r.ok)throw new Error(data.error||data.message||('HTTP '+r.status));return data;}
function toast(msg,ok=true){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(ok?'ok':'err');setTimeout(()=>el.classList.remove('show'),3200);}
function showAuthErr(m){const e=document.getElementById('auth-err');e.textContent=m;e.style.display='block';}
function switchTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.getElementById('login-form').classList.toggle('hidden',t!=='login');document.getElementById('register-form').classList.toggle('hidden',t!=='register');document.getElementById('auth-err').style.display='none';}
async function doLogin(){try{const username=document.getElementById('login-user').value.trim();const password=document.getElementById('login-pass').value;const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});token=data.token;localStorage.setItem('qrex_token',token);await boot();}catch(e){showAuthErr(e.message);}}
async function doRegister(){try{const username=document.getElementById('reg-user').value.trim();const password=document.getElementById('reg-pass').value;const data=await api('/api/auth/register',{method:'POST',body:JSON.stringify({username,password})});token=data.token;localStorage.setItem('qrex_token',token);await boot();}catch(e){showAuthErr(e.message);}}
function logout(){token='';localStorage.removeItem('qrex_token');me=null;document.getElementById('app').style.display='none';document.getElementById('auth-view').style.display='flex';}
async function boot(){try{me=await api('/api/me');document.getElementById('auth-view').style.display='none';document.getElementById('app').style.display='block';document.getElementById('user-name').textContent=me.displayName||me.username;document.getElementById('user-role').textContent=(me.role||'user')+(me.premium?' · Premium':'');const av=document.getElementById('user-avatar');if(me.avatar)av.innerHTML=`<img src="${me.avatar}" alt=""/>`;else av.textContent=(me.username||'?')[0].toUpperCase();document.getElementById('premium-badge').classList.toggle('hidden',!me.premium);document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('hidden',me.role!=='admin'));go(currentPage);}catch(e){logout();}}
function go(page){currentPage=page;document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));document.getElementById('sidebar').classList.remove('open');const titles={dashboard:'Dashboard',scripts:'Scripts',keys:'License Keys',providers:'Providers',hub:'Hub Público',logs:'Execution Logs',webhooks:'Webhooks',account:'Cuenta',admin:'Admin'};document.getElementById('page-title').textContent=titles[page]||page;const fn=pages[page];if(fn)fn();}
function refreshCurrent(){go(currentPage);}
function openModal(title,bodyHtml,footerHtml,wide=false){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=bodyHtml;document.getElementById('modal-footer').innerHTML=footerHtml||'';document.getElementById('modal').classList.toggle('wide',!!wide);document.getElementById('modal-bg').classList.add('open');}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
function escapeHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Copiado')).catch(()=>toast('No se pudo copiar',false));}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleString('es');}
const pages={};
pages.dashboard=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="grid grid-4 mb-4" id="stats"><div class="stat"><div class="label">Cargando...</div></div></div><div class="grid grid-2"><div class="card"><div class="card-h"><h3>Scripts recientes</h3></div><div class="card-b" id="dash-scripts">...</div></div><div class="card"><div class="card-h"><h3>Estado del servicio</h3></div><div class="card-b" id="dash-status">...</div></div></div>`;try{const[scripts,status]=await Promise.all([api('/api/scripts').catch(()=>[]),api('/api/status').catch(()=>({}))]);cache.scripts=Array.isArray(scripts)?scripts:[];const totalExecs=cache.scripts.reduce((a,s)=>a+(s.executions||0),0);document.getElementById('stats').innerHTML=`<div class="stat"><div class="label">Scripts</div><div class="value">${cache.scripts.length}</div></div><div class="stat"><div class="label">Ejecuciones</div><div class="value">${totalExecs}</div></div><div class="stat"><div class="label">Premium</div><div class="value">${me.premium?'Sí':'No'}</div></div><div class="stat"><div class="label">Mongo</div><div class="value" style="font-size:18px;color:${status.mongo?'var(--green)':'var(--red)'}">${status.mongo?'Online':'Offline'}</div></div>`;document.getElementById('dash-scripts').innerHTML=cache.scripts.slice(0,5).map(s=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>${escapeHtml(s.name)}</span><span class="badge-sm badge-purple">${s.executions||0} exec</span></div>`).join('')||'<div class="empty">Sin scripts aún</div>';document.getElementById('dash-status').innerHTML=`<p style="margin-bottom:8px"><b>API:</b> ${status.api||'—'}</p><p style="margin-bottom:8px"><b>Uptime:</b> ${status.uptime?Math.floor(status.uptime/60)+' min':'—'}</p><p style="margin-bottom:8px"><b>Mongo ping:</b> ${status.mongoPingMs??'—'} ms</p><p style="color:var(--muted);font-size:12px;margin-top:12px">Límite free scripts: ${status.freeScriptLimit||15}</p>`;}catch(e){c.innerHTML=`<div class="err" style="display:block">${escapeHtml(e.message)}</div>`;}};
pages.scripts=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="flex mb-4" style="justify-content:space-between"><p style="color:var(--muted);font-size:13px">Crea y protege tus scripts Luau</p><button class="btn btn-primary btn-sm" onclick="openCreateScript()">+ Nuevo script</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Modo</th><th>Ofuscación</th><th>Execs</th><th>Creado</th><th></th></tr></thead><tbody id="scripts-tbody"><tr><td colspan="6" class="empty">Cargando...</td></tr></tbody></table></div></div>`;try{const list=await api('/api/scripts');cache.scripts=Array.isArray(list)?list:[];const tbody=document.getElementById('scripts-tbody');if(!cache.scripts.length){tbody.innerHTML='<tr><td colspan="6" class="empty">No tienes scripts. Crea el primero.</td></tr>';return;}tbody.innerHTML=cache.scripts.map(s=>`<tr><td><b>${escapeHtml(s.name)}</b><br/><span class="mono" style="font-size:11px;color:var(--dim)">${s.id}</span></td><td><span class="badge-sm ${s.keyMode==='key'?'badge-yellow':'badge-green'}">${s.keyMode||'keyless'}</span></td><td><span class="badge-sm badge-purple">${s.obfMode||'—'}</span></td><td>${s.executions||0}</td><td style="font-size:12px;color:var(--muted)">${fmtDate(s.createdAt)}</td><td class="actions"><button class="btn btn-ghost btn-sm" onclick="showLoadstring('${s.id}')">Loadstring</button><button class="btn btn-ghost btn-sm" onclick="editScript('${s.id}')">Editar</button><button class="btn btn-danger btn-sm" onclick="deleteScript('${s.id}')">Eliminar</button></td></tr>`).join('');}catch(e){document.getElementById('scripts-tbody').innerHTML=`<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`;}};
async function openCreateScript(){let providers=[];try{providers=await api('/api/providers');}catch{}openModal('Nuevo script',`<div class="field"><label>Nombre</label><input id="s-name" placeholder="Mi script"/></div><div class="field"><label>Descripción</label><input id="s-desc" placeholder="Opcional"/></div><div class="form-row"><div class="field"><label>Key mode</label><select id="s-keymode"><option value="keyless">Keyless</option><option value="key">Key system</option></select></div><div class="field"><label>Ofuscación</label><select id="s-obf"><option value="hybrid">Hybrid (recomendado)</option><option value="local">Local packer</option><option value="qrex">Qyrex VM</option><option value="none">Ninguna</option></select></div></div><div class="field"><label>Provider (si usas key)</label><select id="s-provider"><option value="">— ninguno —</option>${providers.map(p=>`<option value="${p._id}">${escapeHtml(p.name)}</option>`).join('')}</select></div><div class="field"><label>Código fuente (Luau)</label><textarea id="s-source" placeholder="print('hello')"></textarea></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createScript()">Crear y ofuscar</button>`,true);}
async function createScript(){try{const body={name:document.getElementById('s-name').value.trim(),description:document.getElementById('s-desc').value.trim(),keyMode:document.getElementById('s-keymode').value,obfMode:document.getElementById('s-obf').value,providerId:document.getElementById('s-provider').value||undefined,source:document.getElementById('s-source').value};if(!body.name||!body.source)return toast('Nombre y código requeridos',false);await api('/api/scripts',{method:'POST',body:JSON.stringify(body)});closeModal();toast('Script creado');go('scripts');}catch(e){toast(e.message,false);}}
async function showLoadstring(id){const base=location.origin;const ls=`loadstring(game:HttpGet("${base}/api/v1/luascripts/public/${id}/download"))()`;openModal('Loadstring',`<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Copia y pega en tu executor:</p><div class="copy-box" id="ls-box">${escapeHtml(ls)}</div>`,`<button class="btn btn-primary" onclick="copyText(document.getElementById('ls-box').textContent)">Copiar</button>`);}
async function editScript(id){try{const s=await api('/api/scripts/'+id);openModal('Editar script',`<div class="field"><label>Nombre</label><input id="e-name" value="${escapeHtml(s.name||'')}"/></div><div class="field"><label>Descripción</label><input id="e-desc" value="${escapeHtml(s.description||'')}"/></div><div class="form-row"><div class="field"><label>Key mode</label><select id="e-keymode"><option value="keyless" ${s.keyMode!=='key'?'selected':''}>Keyless</option><option value="key" ${s.keyMode==='key'?'selected':''}>Key system</option></select></div><div class="field"><label>Ofuscación</label><select id="e-obf"><option value="hybrid" ${s.obfMode==='hybrid'?'selected':''}>Hybrid</option><option value="local" ${s.obfMode==='local'?'selected':''}>Local</option><option value="qrex" ${s.obfMode==='qrex'?'selected':''}>Qyrex VM</option><option value="none" ${s.obfMode==='none'?'selected':''}>Ninguna</option></select></div></div><div class="field"><label>Código fuente</label><textarea id="e-source">${escapeHtml(s.source||'')}</textarea></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveScript('${id}')">Guardar</button>`,true);}catch(e){toast(e.message,false);}}
async function saveScript(id){try{await api('/api/scripts/'+id,{method:'PUT',body:JSON.stringify({name:document.getElementById('e-name').value.trim(),description:document.getElementById('e-desc').value.trim(),keyMode:document.getElementById('e-keymode').value,obfMode:document.getElementById('e-obf').value,source:document.getElementById('e-source').value})});closeModal();toast('Guardado');go('scripts');}catch(e){toast(e.message,false);}}
async function deleteScript(id){if(!confirm('¿Eliminar este script?'))return;try{await api('/api/scripts/'+id,{method:'DELETE'});toast('Eliminado');go('scripts');}catch(e){toast(e.message,false);}}
pages.providers=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="flex mb-4" style="justify-content:space-between"><p style="color:var(--muted);font-size:13px">Providers para el key system</p><button class="btn btn-primary btn-sm" onclick="openCreateProvider()">+ Provider</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Validez</th><th>HWID limit</th><th>Tipo link</th><th>Estado</th><th></th></tr></thead><tbody id="prov-tbody"><tr><td colspan="6" class="empty">Cargando...</td></tr></tbody></table></div></div>`;try{const list=await api('/api/providers');cache.providers=Array.isArray(list)?list:[];const tbody=document.getElementById('prov-tbody');if(!cache.providers.length){tbody.innerHTML='<tr><td colspan="6" class="empty">Sin providers</td></tr>';return;}tbody.innerHTML=cache.providers.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b></td><td>${p.keyValidityHours||24}h</td><td>${p.hwidLimit||1}</td><td><span class="badge-sm badge-blue">${p.linkType||'custom'}</span></td><td><span class="badge-sm ${p.enabled!==false?'badge-green':'badge-red'}">${p.enabled!==false?'Activo':'Off'}</span></td><td class="actions"><button class="btn btn-ghost btn-sm" onclick="showClaimInfo('${p._id}')">Claim URL</button><button class="btn btn-danger btn-sm" onclick="deleteProvider('${p._id}')">Eliminar</button></td></tr>`).join('');}catch(e){document.getElementById('prov-tbody').innerHTML=`<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`;}};
function openCreateProvider(){openModal('Nuevo provider',`<div class="field"><label>Nombre</label><input id="p-name" placeholder="MiProvider"/></div><div class="form-row"><div class="field"><label>Validez keys (horas)</label><input id="p-hours" type="number" value="24" min="1"/></div><div class="field"><label>HWID limit</label><input id="p-hwid" type="number" value="1" min="1" max="10"/></div></div><div class="field"><label>Tipo de link</label><select id="p-type"><option value="custom">Custom</option><option value="linkvertise">Linkvertise</option><option value="lootlabs">Lootlabs</option><option value="workink">Work.ink</option><option value="none">None</option></select></div><div class="field"><label>Ad link</label><input id="p-ad" placeholder="https://..."/></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createProvider()">Crear</button>`);}
async function createProvider(){try{await api('/api/providers',{method:'POST',body:JSON.stringify({name:document.getElementById('p-name').value.trim(),keyValidityHours:Number(document.getElementById('p-hours').value),hwidLimit:Number(document.getElementById('p-hwid').value),linkType:document.getElementById('p-type').value,adLink:document.getElementById('p-ad').value.trim()})});closeModal();toast('Provider creado');go('providers');}catch(e){toast(e.message,false);}}
async function showClaimInfo(id){try{const info=await api('/api/keys/claim-info/'+id);openModal('Claim URL',`<p style="font-size:13px;color:var(--muted);margin-bottom:12px">${escapeHtml(info.tip||'')}</p><div class="copy-box" id="claim-url">${escapeHtml(info.claimUrl)}</div>`,`<button class="btn btn-primary" onclick="copyText(document.getElementById('claim-url').textContent)">Copiar URL</button>`);}catch(e){toast(e.message,false);}}
async function deleteProvider(id){if(!confirm('¿Eliminar provider y sus keys?'))return;try{await api('/api/providers/'+id,{method:'DELETE'});toast('Eliminado');go('providers');}catch(e){toast(e.message,false);}}
pages.keys=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="flex mb-4" style="justify-content:space-between"><p style="color:var(--muted);font-size:13px">Genera y gestiona license keys</p><button class="btn btn-primary btn-sm" onclick="openGenKeys()">+ Generar keys</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Key</th><th>Provider</th><th>HWID</th><th>Uses</th><th>Expira</th><th>Estado</th><th></th></tr></thead><tbody id="keys-tbody"><tr><td colspan="7" class="empty">Cargando...</td></tr></tbody></table></div></div>`;try{const list=await api('/api/keys');cache.keys=Array.isArray(list)?list:[];const tbody=document.getElementById('keys-tbody');if(!cache.keys.length){tbody.innerHTML='<tr><td colspan="7" class="empty">Sin keys</td></tr>';return;}tbody.innerHTML=cache.keys.map(k=>`<tr><td class="mono" style="font-size:12px">${escapeHtml(k.key)}</td><td>${escapeHtml(k.providerName||'—')}</td><td>${(k.hwids||[]).length}/${k.hwidLimit||1}</td><td>${k.uses||0}</td><td style="font-size:12px">${k.expiresAt?fmtDate(k.expiresAt):'∞'}</td><td><span class="badge-sm ${k.enabled!==false?'badge-green':'badge-red'}">${k.enabled!==false?'ON':'OFF'}</span></td><td class="actions"><button class="btn btn-ghost btn-sm" onclick="copyText('${k.key}')">Copiar</button><button class="btn btn-ghost btn-sm" onclick="resetHwid('${k._id}')">Reset HWID</button><button class="btn btn-ghost btn-sm" onclick="toggleKey('${k._id}')">Toggle</button><button class="btn btn-danger btn-sm" onclick="deleteKey('${k._id}')">×</button></td></tr>`).join('');}catch(e){document.getElementById('keys-tbody').innerHTML=`<tr><td colspan="7" class="empty">${escapeHtml(e.message)}</td></tr>`;}};
async function openGenKeys(){let providers=[];try{providers=await api('/api/providers');}catch{}if(!providers.length)return toast('Crea un provider primero',false);openModal('Generar keys',`<div class="field"><label>Provider</label><select id="gk-prov">${providers.map(p=>`<option value="${p._id}">${escapeHtml(p.name)}</option>`).join('')}</select></div><div class="form-row"><div class="field"><label>Cantidad</label><input id="gk-amount" type="number" value="5" min="1" max="50"/></div><div class="field"><label>Validez (horas, 0=∞)</label><input id="gk-hours" type="number" value="24" min="0"/></div></div><div class="field"><label>Nota</label><input id="gk-note" placeholder="opcional"/></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="genKeys()">Generar</button>`);}
async function genKeys(){try{const data=await api('/api/keys',{method:'POST',body:JSON.stringify({providerId:document.getElementById('gk-prov').value,amount:Number(document.getElementById('gk-amount').value),validityHours:Number(document.getElementById('gk-hours').value),note:document.getElementById('gk-note').value})});closeModal();const keys=(data.keys||[]).map(k=>k.key).join('\n');openModal('Keys generadas',`<div class="copy-box" id="gen-keys-box" style="white-space:pre-wrap;max-height:240px;overflow:auto">${escapeHtml(keys)}</div>`,`<button class="btn btn-primary" onclick="copyText(document.getElementById('gen-keys-box').textContent)">Copiar todas</button>`);go('keys');}catch(e){toast(e.message,false);}}
async function resetHwid(id){try{await api('/api/keys/'+id+'/reset-hwid',{method:'POST'});toast('HWID reseteado');go('keys');}catch(e){toast(e.message,false);}}
async function toggleKey(id){try{await api('/api/keys/'+id+'/toggle',{method:'POST'});go('keys');}catch(e){toast(e.message,false);}}
async function deleteKey(id){if(!confirm('¿Eliminar key?'))return;try{await api('/api/keys/'+id,{method:'DELETE'});toast('Eliminada');go('keys');}catch(e){toast(e.message,false);}}
pages.hub=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="flex mb-4" style="justify-content:space-between"><p style="color:var(--muted);font-size:13px">Scripts públicos del hub</p><button class="btn btn-primary btn-sm" onclick="openPublishHub()">Publicar mi script</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Owner</th><th>Views</th><th>Loadstring</th><th></th></tr></thead><tbody id="hub-tbody"><tr><td colspan="5" class="empty">Cargando...</td></tr></tbody></table></div></div>`;try{const list=await api('/api/hub');cache.hub=Array.isArray(list)?list:[];const tbody=document.getElementById('hub-tbody');if(!cache.hub.length){tbody.innerHTML='<tr><td colspan="5" class="empty">Hub vacío</td></tr>';return;}tbody.innerHTML=cache.hub.map(h=>`<tr><td><b>${escapeHtml(h.name)}</b><br/><span style="font-size:12px;color:var(--muted)">${escapeHtml(h.description||'')}</span></td><td>${escapeHtml(h.ownerUsername||'—')}</td><td>${h.views||0}</td><td><button class="btn btn-ghost btn-sm" onclick="copyText(\`${(h.loadstring||'').replace(/`/g,'')}\`)">Copiar</button></td><td>${h.ownerId===me.id?`<button class="btn btn-danger btn-sm" onclick="unpublishHub('${h._id}')">Quitar</button>`:''}</td></tr>`).join('');}catch(e){document.getElementById('hub-tbody').innerHTML=`<tr><td colspan="5" class="empty">${escapeHtml(e.message)}</td></tr>`;}};
async function openPublishHub(){let scripts=[];try{scripts=await api('/api/scripts');}catch{}openModal('Publicar en Hub',`<div class="field"><label>Script</label><select id="h-script">${scripts.map(s=>`<option value="${s.id}">${escapeHtml(s.name)} (${s.executions||0} execs)</option>`).join('')}</select></div><div class="field"><label>Nombre público</label><input id="h-name" placeholder="Nombre en el hub"/></div><div class="field"><label>Descripción</label><input id="h-desc" placeholder="Breve descripción"/></div><p style="font-size:12px;color:var(--dim)">Requiere 500+ ejecuciones o Premium.</p>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="publishHub()">Publicar</button>`);}
async function publishHub(){try{await api('/api/hub',{method:'POST',body:JSON.stringify({scriptId:document.getElementById('h-script').value,name:document.getElementById('h-name').value.trim(),description:document.getElementById('h-desc').value.trim()})});closeModal();toast('Publicado en hub');go('hub');}catch(e){toast(e.message,false);}}
async function unpublishHub(id){if(!confirm('¿Quitar del hub?'))return;try{await api('/api/hub/'+id,{method:'DELETE'});toast('Eliminado');go('hub');}catch(e){toast(e.message,false);}}
pages.logs=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="card"><div class="table-wrap"><table><thead><tr><th>Script</th><th>User</th><th>Executor</th><th>HWID</th><th>IP</th><th>Fecha</th><th></th></tr></thead><tbody id="logs-tbody"><tr><td colspan="7" class="empty">Cargando...</td></tr></tbody></table></div></div>`;try{const list=await api('/api/logs');cache.logs=Array.isArray(list)?list:[];const tbody=document.getElementById('logs-tbody');if(!cache.logs.length){tbody.innerHTML='<tr><td colspan="7" class="empty">Sin logs</td></tr>';return;}tbody.innerHTML=cache.logs.map(l=>`<tr><td>${escapeHtml(l.scriptName||l.scriptId)}</td><td>${escapeHtml(l.username||'—')}</td><td>${escapeHtml(l.executor||'—')}</td><td class="mono" style="font-size:11px">${escapeHtml((l.hwid||'').slice(0,16))}${l.hwid&&l.hwid.length>16?'…':''}</td><td style="font-size:12px">${escapeHtml(l.ip||'—')}</td><td style="font-size:12px;color:var(--muted)">${fmtDate(l.createdAt)}</td><td class="actions">${l.ip?`<button class="btn btn-danger btn-sm" onclick="banIp('${escapeHtml(l.ip)}')">Ban IP</button>`:''}${l.hwid?`<button class="btn btn-danger btn-sm" onclick="banHwid('${escapeHtml(l.hwid)}')">Ban HWID</button>`:''}</td></tr>`).join('');}catch(e){document.getElementById('logs-tbody').innerHTML=`<tr><td colspan="7" class="empty">${escapeHtml(e.message)}</td></tr>`;}};
async function banIp(ip){if(!confirm('Banear IP '+ip+'?'))return;try{await api('/api/ban/ip',{method:'POST',body:JSON.stringify({ip,reason:'Banned from Logs'})});toast('IP baneada');}catch(e){toast(e.message,false);}}
async function banHwid(hwid){if(!confirm('Banear HWID?'))return;try{await api('/api/ban/hwid',{method:'POST',body:JSON.stringify({hwid,reason:'HWID banned from Logs'})});toast('HWID baneado');}catch(e){toast(e.message,false);}}
pages.webhooks=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="flex mb-4" style="justify-content:space-between"><p style="color:var(--muted);font-size:13px">Discord webhooks</p><button class="btn btn-primary btn-sm" onclick="openAddWebhook()">+ Webhook</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>URL</th><th>Eventos</th><th>Estado</th><th></th></tr></thead><tbody id="wh-tbody"><tr><td colspan="4" class="empty">Cargando...</td></tr></tbody></table></div></div>`;try{const list=await api('/api/webhooks');cache.webhooks=Array.isArray(list)?list:[];const tbody=document.getElementById('wh-tbody');if(!cache.webhooks.length){tbody.innerHTML='<tr><td colspan="4" class="empty">Sin webhooks</td></tr>';return;}tbody.innerHTML=cache.webhooks.map(w=>`<tr><td class="mono" style="font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis">${escapeHtml(w.url)}</td><td>${(w.events||[]).map(e=>`<span class="badge-sm badge-purple" style="margin:2px">${e}</span>`).join('')}</td><td><span class="badge-sm ${w.enabled?'badge-green':'badge-red'}">${w.enabled?'ON':'OFF'}</span></td><td><button class="btn btn-danger btn-sm" onclick="deleteWebhook('${w._id}')">Eliminar</button></td></tr>`).join('');}catch(e){document.getElementById('wh-tbody').innerHTML=`<tr><td colspan="4" class="empty">${escapeHtml(e.message)}</td></tr>`;}};
function openAddWebhook(){openModal('Nuevo webhook',`<div class="field"><label>URL Discord</label><input id="w-url" placeholder="https://discord.com/api/webhooks/..."/></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="addWebhook()">Añadir</button>`);}
async function addWebhook(){try{await api('/api/webhooks',{method:'POST',body:JSON.stringify({url:document.getElementById('w-url').value.trim()})});closeModal();toast('Webhook añadido');go('webhooks');}catch(e){toast(e.message,false);}}
async function deleteWebhook(id){try{await api('/api/webhooks/'+id,{method:'DELETE'});toast('Eliminado');go('webhooks');}catch(e){toast(e.message,false);}}
pages.account=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="grid grid-2"><div class="card"><div class="card-h"><h3>Perfil</h3></div><div class="card-b"><div class="field"><label>Usuario</label><input id="a-user" value="${escapeHtml(me.username||'')}"/></div><div class="field"><label>Display name</label><input id="a-display" value="${escapeHtml(me.displayName||'')}"/></div><div class="field"><label>Bio</label><input id="a-bio" value="${escapeHtml(me.bio||'')}" maxlength="160"/></div><div class="field"><label>Avatar URL</label><input id="a-avatar" value="${escapeHtml(me.avatar||'')}"/></div><button class="btn btn-primary btn-sm mt-2" onclick="saveProfile()">Guardar perfil</button></div></div><div class="card"><div class="card-h"><h3>Seguridad</h3></div><div class="card-b"><div class="field"><label>Contraseña actual</label><input id="a-cur" type="password"/></div><div class="field"><label>Nueva contraseña</label><input id="a-new" type="password"/></div><button class="btn btn-primary btn-sm mt-2" onclick="changePass()">Cambiar contraseña</button><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"/><button class="btn btn-ghost btn-sm" onclick="logoutOthers()">Cerrar otras sesiones</button></div></div></div>`;};
async function saveProfile(){try{await api('/api/account/profile',{method:'PATCH',body:JSON.stringify({username:document.getElementById('a-user').value.trim(),displayName:document.getElementById('a-display').value.trim(),bio:document.getElementById('a-bio').value.trim(),avatar:document.getElementById('a-avatar').value.trim()})});toast('Perfil actualizado');me=await api('/api/me');go('account');}catch(e){toast(e.message,false);}}
async function changePass(){try{await api('/api/account/password',{method:'POST',body:JSON.stringify({currentPassword:document.getElementById('a-cur').value,newPassword:document.getElementById('a-new').value})});toast('Contraseña actualizada');}catch(e){toast(e.message,false);}}
async function logoutOthers(){try{await api('/api/account/sessions/logout-others',{method:'POST'});toast('Otras sesiones cerradas');}catch(e){toast(e.message,false);}}
pages.admin=async function(){if(me.role!=='admin'){document.getElementById('content').innerHTML='<div class="empty">Solo admin</div>';return;}const c=document.getElementById('content');c.innerHTML=`<div class="grid grid-4 mb-4" id="admin-stats"></div><div class="grid grid-2"><div class="card"><div class="card-h"><h3>Usuarios</h3></div><div class="card-b" style="max-height:400px;overflow:auto" id="admin-users">...</div></div><div class="card"><div class="card-h"><h3>Premium / Reset</h3></div><div class="card-b"><div class="field"><label>Usuario</label><input id="ap-user" placeholder="username"/></div><div class="form-row"><div class="field"><label>Días</label><input id="ap-days" type="number" value="30"/></div><div class="field"><label>Activar</label><select id="ap-on"><option value="1">Sí</option><option value="0">No</option></select></div></div><button class="btn btn-primary btn-sm" onclick="setPremium()">Aplicar premium</button></div></div></div>`;try{const[stats,users]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users')]);document.getElementById('admin-stats').innerHTML=`<div class="stat"><div class="label">Users</div><div class="value">${stats.users||0}</div></div><div class="stat"><div class="label">Scripts</div><div class="value">${stats.scripts||0}</div></div><div class="stat"><div class="label">Hub</div><div class="value">${stats.hub||0}</div></div><div class="stat"><div class="label">Premium</div><div class="value">${stats.premium||0}</div></div>`;document.getElementById('admin-users').innerHTML=(users||[]).map(u=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${escapeHtml(u.username)} ${u.role==='admin'?'<span class="badge-sm badge-purple">admin</span>':''} ${u.premium?'<span class="badge-sm badge-green">premium</span>':''}</span><span style="color:var(--dim);font-size:11px">${fmtDate(u.createdAt)}</span></div>`).join('');}catch(e){c.innerHTML=`<div class="err" style="display:block">${escapeHtml(e.message)}</div>`;}};
async function setPremium(){try{await api('/api/admin/premium',{method:'POST',body:JSON.stringify({username:document.getElementById('ap-user').value.trim(),premium:document.getElementById('ap-on').value==='1',days:Number(document.getElementById('ap-days').value)})});toast('Premium actualizado');go('admin');}catch(e){toast(e.message,false);}}
if(token)boot();else document.getElementById('auth-view').style.display='flex';
